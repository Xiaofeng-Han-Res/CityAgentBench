name: Reference code checks
on:
  push:
    paths: ['cityagentbench/**', 'tests/**', 'scripts/verify_task_preview.py', '.github/workflows/checks.yml']
  pull_request:
    paths: ['cityagentbench/**', 'tests/**', 'scripts/verify_task_preview.py', '.github/workflows/checks.yml']
permissions:
  contents: read
jobs:
  reference-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -B -m unittest discover -s tests -v
